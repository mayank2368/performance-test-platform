apiVersion: 1

datasources:
  - name: k6 (InfluxDB)
    uid: k6influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: k6
      httpMode: GET
    isDefault: true

  - name: Shop API (Prometheus)
    uid: shopprom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
